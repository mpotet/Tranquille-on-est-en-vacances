# Tranquille, on est en vacances - Wrangler / Cloudflare Workers configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name            = "tranquille-vacances"
main            = "worker/index.js"
compatibility_date = "2024-09-23"

# ── Static assets served from the /public directory ──────────────────────────
[assets]
directory = "./public"

# ── Environment variables (non-secret) ───────────────────────────────────────
[vars]
# Public base URL used to build photo URLs
PUBLIC_URL = "https://tranquille-vacances.esti-archi.workers.dev"
# "From" address for notification emails (e.g. "Blog Potet <noreply@yourdomain.com>")
# Left unset: falls back to Resend's onboarding@resend.dev sender (see env.production below).

# ── Cloudflare D1 (SQLite) ────────────────────────────────────────────────────
# Create with: wrangler d1 create tranquille-vacances-db
[[d1_databases]]
binding      = "DB"
database_name = "tranquille-vacances-db"
database_id  = "7144bce8-324e-4df8-a689-455d82dbd335"

# ── Cloudflare R2 (photo storage) ─────────────────────────────────────────────
# Create with: wrangler r2 bucket create tranquille-vacances-photos
[[r2_buckets]]
binding     = "PHOTOS"
bucket_name = "tranquille-vacances-photos"

# ── Secrets (set via `wrangler secret put`) ───────────────────────────────────
# ADMIN_PASSWORD  - plain-text password; the worker hashes it with HMAC-SHA256
# SESSION_SECRET  - random 32-byte hex string used to sign session tokens
#
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put SESSION_SECRET
#
# ── Notification secrets (optional - enable push/email notifications) ─────────
# Generate VAPID keys with: node scripts/generate-vapid.js
#
# wrangler secret put VAPID_PUBLIC_KEY    # base64url raw 65-byte P-256 public key
# wrangler secret put VAPID_PRIVATE_KEY   # base64(JSON.stringify(privateKeyJwk))
# wrangler secret put VAPID_SUBJECT       # mailto:your@email.com
# wrangler secret put RESEND_API_KEY      # re_xxxx  (from resend.com)
# wrangler secret put NOTIFY_FROM_EMAIL   # Blog Potet <noreply@yourdomain.com>

# ── Anti-robot des commentaires : Cloudflare Turnstile (optionnel) ────────────
# Tant que ces deux valeurs ne sont pas definies, la question secrete reste en
# place. Les deux definies => le widget Turnstile la remplace.
# Widget a creer dans le tableau de bord Cloudflare > Turnstile > Add widget
# (domaine : tranquille-vacances.esti-archi.workers.dev, mode Managed).
#   TURNSTILE_SITE_KEY  - cle de site (publique) : a mettre dans [env.production.vars]
#   wrangler secret put TURNSTILE_SECRET --env production   # cle secrete
#   TURNSTILE_HOSTNAMES - optionnel, defaut = hote de PUBLIC_URL
# En local, les cles de test officielles fonctionnent :
#   npx wrangler dev --var TURNSTILE_SITE_KEY:1x00000000000000000000AA --var TURNSTILE_SECRET:1x0000000000000000000000000000000AA

# ── Production environment overrides ─────────────────────────────────────────
[env.production]
name = "tranquille-vacances"
[env.production.vars]
PUBLIC_URL = "https://tranquille-vacances.esti-archi.workers.dev"
# NOTIFY_FROM_EMAIL intentionally omitted: falls back to Resend's onboarding@resend.dev sender

[[env.production.d1_databases]]
binding      = "DB"
database_name = "tranquille-vacances-db"
database_id  = "7144bce8-324e-4df8-a689-455d82dbd335"

[[env.production.r2_buckets]]
binding     = "PHOTOS"
bucket_name = "tranquille-vacances-photos"
