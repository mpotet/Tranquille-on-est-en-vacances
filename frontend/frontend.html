<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Le carnet de bord des voyages de la famille Potet.">
  <title>Tranquille, on est en vacances</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">

  <!-- Phosphor Icons -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">

  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans:    ['Montserrat', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            display: ['"Playfair Display"', 'Georgia', 'serif'],
          },
        }
      }
    }
  </script>

  <style>
    :root {
      color-scheme: light;
      --blue:         #0057B8;
      --blue-dark:    #003D80;
      --blue-light:   #EBF2FD;
      --sky:          #69C6E8;
      --sand:         #F4E8D3;
      --sand-deep:    #E8D5B8;
      --apricot:      #FFC78A;
      --palm:         #2E7D6B;
      --ink:          #0A121E;
      --ink-muted:    #5A6B7A;
      --ink-light:    #8B9CAF;
      --cream:        #FFFDF9;
      --line:         #E8D5B8;
    }

    body { background: var(--cream); color: var(--ink); }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .font-display { font-family: "Playfair Display", Georgia, serif; }
    .font-sans { font-family: Montserrat, ui-sans-serif, sans-serif; }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      box-shadow: 0 1px 3px rgba(10,18,30,.08), 0 4px 8px rgba(10,18,30,.04);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(10,18,30,.12), 0 8px 16px rgba(10,18,30,.06);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--blue);
      color: white;
    }

    .btn-primary:hover {
      background: var(--blue-dark);
    }

    .btn-secondary {
      background: var(--sand);
      color: var(--ink);
    }

    .btn-secondary:hover {
      background: var(--sand-deep);
    }
  </style>
</head>
<body class="font-sans antialiased">

<div id="app"></div>

<script type="module">
// Configuration API
const API_BASE = 'https://tranquille-vacances.esti-archi.workers.dev';

// État global
const state = {
  articles: [],
  folders: [],
  currentPage: 'home',
  currentFolder: null,
  loading: true,
  error: null,
};

// ──────────────────────────────────────────────────────────────
// API calls
// ──────────────────────────────────────────────────────────────
async function fetchAPI(endpoint) {
  try {
    const res = await fetch(`${API_BASE}${endpoint}`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (err) {
    console.error(`API error: ${endpoint}`, err);
    state.error = err.message;
    return null;
  }
}

async function loadInitialData() {
  state.loading = true;

  const [articlesRes, foldersRes] = await Promise.all([
    fetchAPI('/api/articles'),
    fetchAPI('/api/folders'),
  ]);

  if (articlesRes) state.articles = articlesRes.articles || [];
  if (foldersRes) state.folders = foldersRes.folders || [];

  state.loading = false;
  render();
}

// ──────────────────────────────────────────────────────────────
// Rendering
// ──────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');

  if (state.loading) {
    app.innerHTML = '<div class="flex items-center justify-center min-h-screen"><div class="text-center"><div class="animate-spin text-4xl mb-4">⏳</div><p class="text-gray-500">Chargement...</p></div></div>';
    return;
  }

  if (state.error) {
    app.innerHTML = `<div class="flex items-center justify-center min-h-screen"><div class="text-center"><div class="text-4xl mb-4">⚠️</div><p class="text-red-500">${state.error}</p></div></div>`;
    return;
  }

  if (state.currentPage === 'home') renderHome();
  else if (state.currentPage === 'voyages') renderVoyages();
}

function renderHome() {
  const app = document.getElementById('app');
  const recentArticles = state.articles.slice(0, 3);

  app.innerHTML = `
    <div style="background: linear-gradient(135deg, var(--blue) 0%, var(--blue-dark) 40%, var(--palm) 100%); color: white; padding: 4rem 1rem; text-align: center;">
      <h1 class="font-display text-5xl font-bold mb-2">Tranquille, on est en vacances</h1>
      <p class="text-lg opacity-90">Le carnet de bord des voyages de la famille Potet</p>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-16">
      <h2 class="font-display text-3xl font-bold mb-8">Dernières escales</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        ${recentArticles.map(a => `
          <div class="card p-4 cursor-pointer" onclick="goVoyage('${a.slug}')">
            ${a.cover ? `<img src="${a.cover}" alt="${a.title}" class="w-full h-48 object-cover rounded-lg mb-4">` : ''}
            <h3 class="font-bold text-lg mb-2">${a.title}</h3>
            <p class="text-sm text-gray-500">${a.destination}</p>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 py-8 text-center">
      <button class="btn btn-primary" onclick="goPage('voyages')">
        Voir tous les voyages →
      </button>
    </div>
  `;
}

function renderVoyages() {
  const app = document.getElementById('app');

  app.innerHTML = `
    <div class="max-w-6xl mx-auto px-4 py-16">
      <h1 class="font-display text-4xl font-bold mb-8">Tous nos voyages</h1>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        ${state.articles.map(a => `
          <div class="card p-4 cursor-pointer" onclick="goVoyage('${a.slug}')">
            ${a.cover ? `<img src="${a.cover}" alt="${a.title}" class="w-full h-48 object-cover rounded-lg mb-4">` : ''}
            <h3 class="font-bold text-lg mb-2">${a.title}</h3>
            <p class="text-sm text-gray-500 mb-3">${a.destination}</p>
            <p class="text-xs text-gray-400">${new Date(a.date).toLocaleDateString('fr-FR')}</p>
          </div>
        `).join('')}
      </div>

      <div class="text-center mt-8">
        <button class="btn btn-secondary" onclick="goPage('home')">
          ← Retour à l'accueil
        </button>
      </div>
    </div>
  `;
}

// ──────────────────────────────────────────────────────────────
// Navigation
// ──────────────────────────────────────────────────────────────
function goPage(page) {
  state.currentPage = page;
  render();
}

function goVoyage(slug) {
  const article = state.articles.find(a => a.slug === slug);
  if (!article) return;

  const app = document.getElementById('app');
  const content = article.content ? marked.parse(article.content) : '';

  app.innerHTML = `
    <div class="max-w-4xl mx-auto px-4 py-16">
      <button class="btn btn-secondary mb-8" onclick="goPage('voyages')">
        ← Retour aux voyages
      </button>

      ${article.cover ? `
        <div class="mb-8">
          <img src="${article.cover}" alt="${article.title}" class="w-full h-96 object-cover rounded-2xl">
        </div>
      ` : ''}

      <h1 class="font-display text-4xl font-bold mb-4">${article.title}</h1>
      <p class="text-lg text-gray-600 mb-8">${article.destination}</p>

      <div class="prose max-w-none mb-8">
        ${content}
      </div>

      <div class="card p-6 text-center">
        <p class="text-sm text-gray-500">Fin de l'article</p>
      </div>

      <button class="btn btn-secondary mt-8" onclick="goPage('voyages')">
        ← Retour aux voyages
      </button>
    </div>
  `;
}

// ──────────────────────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────────────────────
loadInitialData();

// Exposer les fonctions globales
window.goPage = goPage;
window.goVoyage = goVoyage;
</script>

</body>
</html>
